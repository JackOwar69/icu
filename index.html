<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICU Nursing Kardex & Ventilator Flowsheet</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-header: #f8c8d4;
            --theme-border: #e6a8b7;
            --theme-light: #fdf2f5;
            --theme-dot: #f2a2b8;
            --theme-accent: #d84374;
            --theme-accent-dark: #b8325e;
            --theme-bg: #f3ecee;
            --theme-banner-text: #111111;
            --text-dark: #2c2c2c;
            --text-muted: #7a7a7a;
            --data-blue: #164684;
            --drip-red: #b71c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--theme-bg);
            color: var(--text-dark);
            padding: 20px;
            transition: background-color 0.25s ease;
        }

        .control-panel {
            max-width: 1240px;
            margin: 0 auto 25px auto;
            background: #ffffff;
            border: 2px solid var(--theme-border);
            border-radius: 12px;
            padding: 18px 24px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            font-family: 'Quicksand', sans-serif;
            direction: ltr;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--theme-border);
            padding-bottom: 12px;
        }

        .control-header h1 {
            font-size: 1.22rem;
            font-weight: 700;
            color: var(--theme-accent-dark);
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .actions-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .theme-select {
            padding: 7px 12px;
            border: 1.5px solid var(--theme-border);
            border-radius: 8px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 0.84rem;
            background-color: var(--theme-light);
            color: var(--theme-accent-dark);
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }

        .btn {
            background-color: var(--theme-accent);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--theme-accent-dark);
        }

        .btn-secondary {
            background-color: var(--theme-light);
            color: var(--theme-accent-dark);
            border: 1px solid var(--theme-border);
        }

        .btn-secondary:hover {
            background-color: var(--theme-header);
            color: var(--theme-banner-text);
        }

        .filters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        .search-group {
            display: flex;
            gap: 10px;
            flex: 1;
            min-width: 280px;
        }

        .search-group input, .search-group select {
            padding: 8px 12px;
            border: 1.5px solid var(--theme-border);
            border-radius: 8px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            width: 100%;
            outline: none;
            color: var(--text-dark);
            background: #fff;
        }

        .pagination-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            background: var(--theme-light);
            border: 1px solid var(--theme-border);
            color: var(--theme-accent-dark);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .sheets-grid {
            max-width: 1240px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        .sheets-grid.two-cols {
            grid-template-columns: repeat(auto-fit, minmax(560px, 1fr));
        }

        .patient-sheet {
            background: #ffffff;
            border: 2.5px solid var(--theme-border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
            position: relative;
            overflow: hidden;
            page-break-inside: avoid;
        }

        .section-banner {
            background-color: var(--theme-header);
            border-top: 2px solid var(--theme-border);
            border-bottom: 2px solid var(--theme-border);
            padding: 5px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.8px;
            color: var(--theme-banner-text);
            text-transform: uppercase;
        }

        .patient-sheet > .section-banner:first-child {
            border-top: none;
        }

        .num-badge {
            background-color: #111111;
            color: #ffffff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .sheet-row {
            display: grid;
            border-bottom: 1.5px solid var(--theme-border);
        }

        .sheet-row.dotted-bottom {
            border-bottom: 1.5px dotted var(--theme-border);
        }

        .cell {
            padding: 6px 10px;
            border-right: 1.5px solid var(--theme-border);
            font-size: 0.82rem;
            line-height: 1.38;
        }

        .cell.dotted-right {
            border-right: 1.5px dotted var(--theme-border);
        }

        .cell:last-child { border-right: none; }

        .field-label {
            font-weight: 700;
            color: #333;
            margin-right: 4px;
        }

        .field-value {
            color: var(--data-blue);
            font-weight: 600;
        }

        .accent-text {
            color: var(--theme-accent-dark);
            font-weight: 700;
        }

        .pink-options {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pink-opt {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: #555;
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background-color: var(--theme-dot);
            display: inline-block;
        }

        .dot.active {
            background-color: var(--theme-accent);
            box-shadow: 0 0 0 2px var(--theme-light), 0 0 0 3.5px var(--theme-accent);
        }

        .bg-top-row { grid-template-columns: 2.2fr 1.2fr 2fr; }
        .bg-mid-row { grid-template-columns: 1.35fr 1.55fr 1.05fr 1.05fr; }

        .sub-box-title {
            text-align: center;
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: #222;
        }

        .checklist-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .assessment-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .assessment-cell {
            padding: 8px 10px;
            min-height: 76px;
            border-bottom: 1.5px dotted var(--theme-border);
            border-right: 1.5px solid var(--theme-border);
            font-size: 0.82rem;
        }

        .assessment-cell:nth-child(2n) { border-right: none; }
        .assessment-cell.no-bottom { border-bottom: none; }

        .assessment-content {
            margin-top: 4px;
            color: var(--data-blue);
            font-weight: 600;
            font-size: 0.8rem;
            line-height: 1.42;
        }

        .middle-triple-grid {
            display: grid;
            grid-template-columns: 1.5fr 1.15fr 1.45fr;
            border-top: 2px solid var(--theme-border);
            border-bottom: 2px solid var(--theme-border);
        }

        .triple-col {
            border-right: 1.5px solid var(--theme-border);
            display: flex;
            flex-direction: column;
        }

        .triple-col:last-child { border-right: none; }

        .triple-col .section-banner {
            border-top: none;
            justify-content: flex-start;
            padding-left: 10px;
        }

        .vitals-cols {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            flex: 1;
            min-height: 92px;
        }

        .vital-item {
            border-right: 1.5px dotted var(--theme-border);
            padding: 6px 3px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 10px;
        }

        .vital-item:last-child { border-right: none; }

        .vital-item .v-label {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .vital-item .v-val {
            font-size: 0.82rem;
            color: var(--data-blue);
            font-weight: 700;
        }

        /* المساحة المخصصة للأشعة تحت العلامات الحيوية مباشرة */
        .vitals-radiology-box {
            border-top: 1.5px dotted var(--theme-border);
            padding: 5px 8px;
            font-size: 0.74rem;
            color: var(--text-muted);
            font-weight: 700;
            background-color: #ffffff;
            line-height: 1.35;
        }

        /**/
        .vitals-ecg-box {
            border-top: 1.5px dotted var(--theme-border);
            padding: 6px 8px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ecg-header-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.73rem;
            font-weight: 700;
            color: var(--text-muted);
            flex-wrap: wrap;
            gap: 4px;
        }

        .ecg-strip-frame {
            width: 100%;
            height: 46px;
            border: 1.5px solid var(--theme-border);
            border-radius: 6px;
            background-color: var(--theme-light);
            background-image:
                linear-gradient(to right, rgba(216, 67, 116, 0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(216, 67, 116, 0.12) 1px, transparent 1px),
                linear-gradient(to right, rgba(216, 67, 116, 0.24) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(216, 67, 116, 0.24) 1px, transparent 1px);
            background-size: 6px 6px, 6px 6px, 30px 30px, 30px 30px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .ecg-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .vent-params-cols {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            background-color: #ffffff;
        }

        .vent-param-box {
            border-right: 1.5px dotted var(--theme-border);
            padding: 8px 5px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 6px;
        }

        .vent-param-box:last-child {
            border-right: none;
        }

        .vent-param-box .vp-label {
            font-size: 0.66rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .vent-param-box .vp-val {
            font-size: 0.8rem;
            color: var(--theme-accent-dark);
            font-weight: 700;
            line-height: 1.25;
        }

        .vent-mechanics-footer {
            border-top: 1.5px dotted var(--theme-border);
            border-bottom: 2px solid var(--theme-border);
            padding: 6px 12px;
            background-color: var(--theme-light);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.77rem;
            font-weight: 700;
            color: #333;
        }

        .accu-body {
            flex: 1;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .lab-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            padding: 6px 8px;
            font-size: 0.73rem;
            gap: 4px;
        }

        .lab-col-left {
            border-right: 1.5px dotted var(--theme-border);
            padding-right: 6px;
        }

        .lab-col-right { padding-left: 6px; }

        .lab-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .lab-line span.val { color: var(--data-blue); }

        .lab-other {
            border-top: 1.5px dotted var(--theme-border);
            padding: 4px 8px;
            font-size: 0.74rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .bottom-double-grid {
            display: grid;
            grid-template-columns: 1.45fr 1.55fr;
        }

        .bottom-col {
            border-right: 1.5px solid var(--theme-border);
            display: flex;
            flex-direction: column;
        }

        .bottom-col:last-child { border-right: none; }

        .bottom-col .section-banner {
            border-top: none;
            justify-content: flex-start;
            padding-left: 10px;
        }

        .meds-table {
            width: 100%;
            border-collapse: collapse;
        }

        .meds-table th {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 700;
            padding: 5px;
            border-bottom: 1.5px dotted var(--theme-border);
            background: var(--theme-light);
        }

        .meds-table th:first-child, .meds-table td:first-child {
            width: 88px;
            border-right: 1.5px dotted var(--theme-border);
            text-align: center;
            color: var(--theme-accent-dark);
            font-weight: 700;
            font-size: 0.72rem;
        }

        .meds-table td {
            padding: 5px 8px;
            border-bottom: 1.5px dotted var(--theme-border);
            font-size: 0.76rem;
            color: var(--data-blue);
            font-weight: 600;
            line-height: 1.35;
        }

        .meds-table tr.drip-row td {
            background-color: var(--theme-light);
            color: var(--drip-red);
        }

        /* CLICKABLE DRUG, DIAGNOSIS, VENT MODE, ABG, RADIOLOGY & ECG STYLING */
        .clickable-drug, .clickable-diagnosis, .clickable-vent-mode, .clickable-abg, .clickable-rad, .clickable-ecg {
            color: var(--theme-accent-dark);
            background-color: var(--theme-light);
            border: 1px solid var(--theme-border);
            padding: 1px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            display: inline-block;
            margin: 1px 0;
            transition: 0.15s;
        }

        .clickable-diagnosis {
            padding: 3px 8px;
            margin-top: 3px;
            font-size: 0.8rem;
            line-height: 1.3;
            text-decoration: underline;
            text-decoration-style: dotted;
        }

        .clickable-vent-mode {
            padding: 3px 6px;
            font-size: 0.76rem;
            line-height: 1.25;
            text-decoration: underline;
            text-decoration-style: dotted;
        }

        .clickable-abg, .clickable-rad, .clickable-ecg {
            padding: 1px 7px;
            font-size: 0.73rem;
            text-decoration: underline;
            text-decoration-style: dotted;
            margin-right: 3px;
        }

        .clickable-drug:hover, .clickable-diagnosis:hover, .clickable-vent-mode:hover, .clickable-abg:hover, .clickable-rad:hover, .clickable-ecg:hover {
            background-color: var(--theme-header);
            color: var(--theme-banner-text);
        }

        .notes-body {
            padding: 10px;
            font-size: 0.79rem;
            line-height: 1.45;
            color: var(--data-blue);
            font-weight: 600;
            white-space: pre-line;
        }

        .nursing-tag {
            display: inline-block;
            background: var(--theme-light);
            color: var(--theme-accent-dark);
            border: 1px solid var(--theme-border);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        /* POPUP MODAL STYLING */
        .drug-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.48);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .drug-modal-content {
            background: #ffffff;
            border: 2.5px solid var(--theme-border);
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        .drug-modal-header {
            background-color: var(--theme-header);
            border-bottom: 2px solid var(--theme-border);
            padding: 10px 16px;
            font-weight: 700;
            font-size: 0.98rem;
            color: var(--theme-banner-text);
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 0.6px;
        }

        .drug-modal-body {
            padding: 16px 20px;
            font-size: 0.84rem;
            line-height: 1.52;
            color: var(--text-dark);
            max-height: 74vh;
            overflow-y: auto;
        }

        .drug-info-row {
            margin-bottom: 12px;
            border-bottom: 1.5px dotted var(--theme-border);
            padding-bottom: 9px;
        }

        .drug-info-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .drug-info-title {
            font-weight: 700;
            color: var(--theme-accent-dark);
            margin-bottom: 4px;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .drug-info-text {
            color: var(--data-blue);
            font-weight: 600;
            white-space: pre-line;
        }

        .drug-modal-footer {
            background-color: var(--theme-light);
            border-top: 2px solid var(--theme-border);
            padding: 10px 16px;
            text-align: center;
        }

        .close-modal-btn {
            background-color: var(--theme-accent);
            color: #fff;
            border: none;
            padding: 7px 28px;
            border-radius: 8px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .close-modal-btn:hover {
            background-color: var(--theme-accent-dark);
        }

        @media (max-width: 900px) {
            .vent-params-cols { grid-template-columns: repeat(3, 1fr); }
            .vent-param-box { border-bottom: 1px dotted var(--theme-border); }
        }

        @media print {
            .control-panel, .drug-modal-overlay { display: none !important; }
            body { background: #fff; padding: 0; }
            .patient-sheet { box-shadow: none; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="control-header">
            <h1>ICU Patient Kardex, Drug Sheet & Ventilator Panel</h1>
            <div class="actions-wrapper">
                <span id="recordCountBadge" class="status-badge">Loading dataset...</span>
                <select id="themeSelector" class="theme-select" onchange="applyTheme(this.value)">
                    <option value="rose_pink">Theme: Rose Pink (Default)</option>
                    <option value="clinical_blue">Theme: Clinical Blue</option>
                    <option value="surgical_green">Theme: Surgical Green</option>
                    <option value="emerald_teal">Theme: Emerald Teal</option>
                    <option value="slate_black">Theme: Slate Black</option>
                    <option value="royal_purple">Theme: Royal Purple</option>
                    <option value="amber_gold">Theme: Amber Gold</option>
                    <option value="crimson_red">Theme: Crimson Red</option>
                    <option value="navy_indigo">Theme: Navy Indigo</option>
                    <option value="olive_sage">Theme: Olive Sage</option>
                    <option value="warm_terracotta">Theme: Warm Terracotta</option>
                    <option value="charcoal_gray">Theme: Charcoal Monochrome</option>
                </select>
                <button class="btn btn-secondary" onclick="toggleGridView()" id="gridToggleBtn">
                    2-Column View (2-Up)
                </button>
                <button class="btn btn-secondary" onclick="window.print()">
                    Print / Save PDF
                </button>
            </div>
        </div>

        <div class="filters-row">
            <div class="search-group">
                <input type="text" id="searchInput" placeholder="Search by Patient ID (ICU-10001), Name, Medication, or Diagnosis..." oninput="applyFilters()">
                <select id="diagnosisFilter" onchange="applyFilters()">
                    <option value="ALL">All ICU Diagnoses</option>
                </select>
                <select id="ventFilter" onchange="applyFilters()">
                    <option value="ALL">Ventilator Status: All Patients</option>
                    <option value="Yes">On Mechanical Ventilator</option>
                    <option value="No">Spontaneous Breathing / O2</option>
                </select>
            </div>

            <div class="pagination-group">
                <button class="btn btn-secondary" onclick="prevPage()">Previous</button>
                <span id="pageIndicator" class="status-badge">Record 1 of 1</span>
                <button class="btn btn-secondary" onclick="nextPage()">Next</button>
                <button class="btn" onclick="randomPatient()">Random Case</button>
            </div>
        </div>
    </div>

    <div id="sheetsContainer" class="sheets-grid"></div>

    <!-- SHARED CLINICAL POPUP MODAL (FOR MEDICATIONS, DIAGNOSES, VENT MODES, ABG & RADIOLOGY) -->
    <div id="drugModalOverlay" class="drug-modal-overlay" onclick="closeDrugModal()">
        <div class="drug-modal-content" onclick="event.stopPropagation()">
            <div class="drug-modal-header" id="modalDrugHeader">Clinical Reference Guide</div>
            <div class="drug-modal-body" id="modalDrugBody"></div>
            <div class="drug-modal-footer">
                <button class="close-modal-btn" onclick="closeDrugModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        let allPatients = [];
        let filteredPatients = [];
        let currentPage = 0;
        let twoColumnMode = false;

        // =========================================================================
        // 1. MECHANICAL VENTILATOR MODES CLINICAL ENCYCLOPEDIA
        // =========================================================================
        const VENT_MODE_DATABASE = [
            {
                match: ["ac/vc", "volume control", "ardsnet", "obstructive", "normocapnia", "100% o2"],
                title: "AC/VC (Assist-Control / Volume Control Ventilation)",
                fullName: "Continuous Mandatory Ventilation - Volume Control (AC/VC or CMV-VC).",

        // 4. دالة تحليل وتفسير الـ ABG الكامل وكيفية تصحيحه للحالة المثالية (ABG Interpretation Popup)
        function openABGModal(patientId) {
            const p = filteredPatients.find(item => item.Patient_ID === patientId) ||
                      allPatients.find(item => item.Patient_ID === patientId);
            if (!p) return;

            const labs = p.Labs || {};
            const abgStr = labs.ABG_Other || p.ABG_and_Key_Labs || "";

            const phMatch = abgStr.match(/pH[:\s]*([0-9.]+)/i);
            const paco2Match = abgStr.match(/PaCO2[:\s]*([0-9.]+)/i);
            const pao2Match = abgStr.match(/PaO2[:\s]*([0-9.]+)/i);
            const hco3Match = abgStr.match(/HCO3[:\s]*([0-9.]+)/i);
            const lacMatch = abgStr.match(/Lactate[:\s]*([0-9.]+)/i);

            const ph = parseFloat(labs.PH || (phMatch ? phMatch[1] : 7.38));
            const paco2 = parseFloat(paco2Match ? paco2Match[1] : 40);
            const pao2 = parseFloat(pao2Match ? pao2Match[1] : 90);
            const hco3 = parseFloat(hco3Match ? hco3Match[1] : 24);
            const lactate = parseFloat(lacMatch ? lacMatch[1] : 1.5);
            const kVal = parseFloat(labs.K || 4.2);
            const naVal = parseFloat(labs.NA || 140);
            const onVent = p.On_Ventilator === "Yes" || (p.Ventilator_Parameters && p.Ventilator_Parameters.Attached);
            const diag = p.ICU_Diagnosis || "";

            let primaryDisorder = "";
            let compensationStatus = "";
            let physiologicalMechanism = "";
            let correctionPlan = "";

            const isAcidemic = ph < 7.35;
            const isAlkalemic = ph > 7.45;
            const phStatus = isAcidemic ? `Acidemia (Low pH ${ph} < 7.35)` : (isAlkalemic ? `Alkalemia (High pH ${ph} > 7.45)` : `Normal Arterial pH (${ph} within 7.35 - 7.45)`);

            if (paco2 > 45 && hco3 < 22) {
                primaryDisorder = "Severe Mixed Respiratory & Metabolic Acidosis";
                compensationStatus = "Decompensated Mixed Acidosis (Both systems failing simultaneously)";
                physiologicalMechanism = "- Lungs are failing to clear CO2 (Alveolar Hypoventilation -> high PaCO2 > 45 mmHg) while tissues/kidneys are generating excess metabolic acid or losing bicarbonate (HCO3 < 22 mEq/L).";
                correctionPlan = "- 1. Ventilator Adjustment (Clear CO2): Increase Minute Ventilation (MVe = RR x VT) by increasing Respiratory Rate by 2-4 bpm or Tidal Volume (while keeping Plateau Pressure < 30 cmH2O).\n- 2. Metabolic Correction: Treat underlying shock/tissue hypoxia with fluids and vasopressors (MAP >= 65 mmHg) to clear Lactate; consider isotonic Sodium Bicarbonate drip ONLY if pH drops < 7.15.";
            } else if (ph < 7.35 && paco2 > 45) {
                primaryDisorder = "Primary Respiratory Acidosis";
                if (hco3 > 26) {
                    compensationStatus = "Partially Compensated (Acute-on-Chronic Respiratory Acidosis with Renal HCO3 Retention)";
                } else {
                    compensationStatus = "Uncompensated Acute Respiratory Acidosis (Renal HCO3 buffering takes 3-5 days to develop)";
                }
                physiologicalMechanism = "- Alveolar hypoventilation, severe bronchospasm (COPD/Asthma), or ARDS low-tidal-volume ventilation causes CO2 retention (Hypercapnia).\n- Kidneys attempt to compensate by excreting H+ ions (as NH4+) and reabsorbing Bicarbonate (HCO3-) in the proximal tubules.";
                if (diag.includes("ARDS")) {
                    correctionPlan = "- 1. Permissive Hypercapnia Rule in ARDS: In Severe ARDS on low Tidal Volume (4-6 mL/kg IBW), PaCO2 50-65 mmHg is intentionally tolerated as long as pH >= 7.20 to prevent ventilator-induced lung injury.\n- 2. If pH < 7.15: Increase Set RR up to 30-35 bpm (watch for Auto-PEEP) and clear ETT dead-space/secretions.";
                } else if (diag.includes("COPD") || diag.includes("Asthma")) {
                    correctionPlan = "- 1. Bronchodilation & Expiratory Time: Administer inline Salbutamol + Ipratropium nebulizers and IV Corticosteroids to relieve airway resistance.\n- 2. Ventilator Adjustment: Prolong Expiratory Time (I:E ratio 1:3.5 to 1:4.5, high inspiratory flow 80-100 L/min) to eliminate trapped air (Auto-PEEP).\n- 3. Target Baseline PaCO2: Lower PaCO2 gradually toward patient's chronic baseline (50-55 mmHg), NOT 40 mmHg, to avoid post-hypercapnic metabolic alkalosis.";
                } else {
                    correctionPlan = "- 1. Increase Alveolar Minute Ventilation: Use formula [New RR = (Current RR x Current PaCO2) / Desired PaCO2 40 mmHg].\n- 2. Clear Airway Obstruction: Suction ETT secretions, check for circuit kinks, and reverse excess opioid/sedative depression.";
                }
            } else if (ph < 7.35 && hco3 < 22) {
                const expectedPaco2Min = Math.round((1.5 * hco3 + 8) - 2);
                const expectedPaco2Max = Math.round((1.5 * hco3 + 8) + 2);
                primaryDisorder = "Primary Metabolic Acidosis" + (lactate > 2.5 ? " (High-Anion-Gap Lactic / Keto Acidosis)" : "");
                if (paco2 < 35) {
                    compensationStatus = `Partially Compensated by Respiratory Hyperventilation (Kussmaul Breathing) | Winter's Formula Expected PaCO2: ${expectedPaco2Min}-${expectedPaco2Max} mmHg (Actual: ${paco2} mmHg)`;
                } else {
                    compensationStatus = `Uncompensated / Inadequate Respiratory Compensation | Winter's Formula Expected PaCO2: ${expectedPaco2Min}-${expectedPaco2Max} mmHg (Actual: ${paco2} mmHg -> indicates concomitant respiratory fatigue!)`;
                }
                physiologicalMechanism = "- Excess fixed acids (Lactic acid from shock/hypoperfusion, Ketoacids in DKA, or Uremic acids in AKI) consume serum Bicarbonate (HCO3-).\n- Central chemoreceptors sense Low pH and stimulate deep, rapid Kussmaul respirations to blow off volatile acid (CO2) via the lungs.";
                if (diag.includes("DKA") || diag.includes("Diabetic")) {
                    correctionPlan = "- 1. Stop Ketogenesis: Continuous IV Regular Insulin infusion (0.1 Units/kg/hr) + aggressive IV Crystalloid hydration (Normal Saline / Ringer's Lactate) -> metabolizing ketones regenerates endogenous HCO3-!\n- 2. Protect Potassium: Check K+ q2h and replace KCl (insulin + rising pH drives K+ rapidly into cells).\n- 3. Avoid Sodium Bicarbonate unless pH < 6.90-7.00.";
                } else if (diag.includes("Kidney") || diag.includes("AKI") || diag.includes("ESRD") || diag.includes("Acidosis")) {
                    correctionPlan = "- 1. Isotonic Sodium Bicarbonate Infusion: Infuse 150 mEq NaHCO3 in 1L D5W @ 100-150 mL/hr if pH < 7.15.\n- 2. Renal Replacement Therapy: Initiate CRRT (CVVHDF) or Hemodialysis with high-bicarbonate dialysate to clear uremic acids and restore HCO3- to 22-24 mEq/L.";
                } else {
                    correctionPlan = "- 1. Treat Root Cause of Lactic Acidosis: Restore tissue oxygen delivery with Balanced Crystalloids (Ringer's Lactate), Vasopressors (Target MAP >= 65 mmHg), and early Antibiotics/Source Control.\n- 2. Maintain Compensatory Minute Ventilation: If patient is intubated, set ventilator RR high enough (20-26 bpm) to match their compensatory hyperventilation.";
                }
            } else if (ph > 7.45 && paco2 < 35) {
                primaryDisorder = "Primary Respiratory Alkalosis";
                compensationStatus = hco3 < 22 ? "Partially Compensated by Renal Bicarbonate Excretion" : "Uncompensated Acute Respiratory Alkalosis";
                physiologicalMechanism = "- Alveolar hyperventilation (driven by hypoxia, pain, anxiety, fever, hepatic encephalopathy ammonia, or excessive ventilator RR/VT) blows off too much CO2 (Hypocapnia < 35 mmHg).";
                correctionPlan = onVent
                    ? "- 1. Ventilator Adjustment: Reduce Set Respiratory Rate (RR) by 2-4 bpm or reduce Tidal Volume (unless patient is triggers-driving due to pain/hypoxia).\n- 2. Treat Underlying Trigger: Provide adequate analgesia/sedation, control fever, and correct hypoxemia."
                    : "- 1. Treat Underlying Trigger of Tachypnea: Correct hypoxemia with supplemental O2, relieve pain/anxiety, and treat hepatic encephalopathy (Lactulose) or pulmonary embolism.";
            } else if (ph > 7.45 && hco3 > 26) {
                primaryDisorder = "Primary Metabolic Alkalosis";
                compensationStatus = paco2 > 45 ? "Partially Compensated by Alveolar Hypoventilation" : "Uncompensated Metabolic Alkalosis";
                physiologicalMechanism = "- Loss of hydrogen/chloride ions via NG suctioning/vomiting or loop diuretic (Furosemide) contraction alkalosis and hypokalemia.";
                correctionPlan = "- 1. Chloride & Potassium Replacement: Infuse 0.9% Normal Saline and replace Potassium Chloride (KCl) to allow kidneys to excrete excess HCO3-.\n- 2. Consider Acetazolamide (Diamox) 250-500 mg IV if diuretic-induced contraction alkalosis.";
            } else {
                primaryDisorder = (paco2 < 35 && hco3 < 22) ? "Fully Compensated Metabolic Acidosis / Respiratory Alkalosis" :
                                  (paco2 > 45 && hco3 > 26) ? "Fully Compensated Chronic Respiratory Acidosis" :
                                  "Normal Balanced Acid-Base Status (Euhydric pH)";
                compensationStatus = "Fully Compensated / Physiologically Balanced (pH 7.35 - 7.45)";
                physiologicalMechanism = "- Arterial pH is maintained within the optimal physiological window (7.35 - 7.45) for cellular enzymatic function and myocardial contractility.";
                correctionPlan = "- 1. Maintain Current Strategy: Continue current ventilator settings (Normocapnia target PaCO2 35-40 mmHg, especially critical in TBI/ICP).\n- 2. Wean FiO2/PEEP gradually as oxygenation allows while monitoring serial ABGs.";
            }

            const o2Status = pao2 < 60 ? `Severe Hypoxemia (PaO2 ${pao2} mmHg < 60 -> Acute Hypoxemic Respiratory Failure)` :
                             (pao2 < 80 ? `Mild-to-Moderate Hypoxemia (PaO2 ${pao2} mmHg < 80)` :
                             (pao2 > 120 ? `Hyperoxemia (PaO2 ${pao2} mmHg > 120 -> Consider weaning FiO2 unless CO Poisoning)` :
                             `Normal Arterial Oxygenation (PaO2 ${pao2} mmHg within 80-100)`));

            const o2Correction = pao2 < 65
                ? "Increase Oxygenation (Mean Airway Pressure): Increase PEEP by 2-4 cmH2O (to recruit alveoli), titrate FiO2 to keep SpO2 >= 90-94%, suction ETT secretions, and utilize Prone Positioning if P/F ratio < 150."
                : (pao2 > 125 && !diag.includes("Carbon Monoxide")
                    ? "Prevent Hyperoxic Lung/Reperfusion Injury: Wean FiO2 down in 5-10% increments to maintain target PaO2 75-100 mmHg (SpO2 94-98%)."
                    : "Oxygenation is at clinical target; maintain current PEEP and FiO2.");

            const lacStatus = lactate >= 4.0 ? `Severe Hyperlactatemia (${lactate} mmol/L >= 4.0 -> Critical Tissue Hypoperfusion / Shock)` :
                              (lactate >= 2.0 ? `Elevated Serum Lactate (${lactate} mmol/L -> Cellular Hypoxia / Stress)` :
                              `Normal Serum Lactate (${lactate} mmol/L < 2.0)`);

            const kShiftEffect = isAcidemic
                ? `Acidemia Effect (pH ${ph}): Excess extracellular H+ ions shift into cells in exchange for K+ moving OUT into serum -> Serum K+ (${kVal} mEq/L) rises by ~0.6 mEq/L for every 0.1 drop in pH. WARNING: As you correct acidosis and pH rises back to 7.40, K+ will rapidly shift back into cells causing dangerous Hypokalemia! Additionally, acidosis decreases albumin binding, increasing free Ionized Calcium (Ca++).`
                : (isAlkalemic
                    ? `Alkalemia Effect (pH ${ph}): H+ ions move out of cells while K+ shifts INTO cells -> causes Hypokalemia (Current K+: ${kVal} mEq/L). Alkalosis also increases Calcium binding to albumin, dropping free Ionized Calcium (Ca++) and causing tetany/arrhythmias!`
                    : `Normal pH (${ph}): Extracellular-to-intracellular Potassium (Current K+: ${kVal} mEq/L) and Ionized Calcium equilibrium is stable.`);

            document.getElementById("modalDrugHeader").textContent = `ABG Interpretation & Correction (${p.Patient_ID})`;
            document.getElementById("modalDrugBody").innerHTML = `
                <div class="drug-info-row">
                    <div class="drug-info-title">1. Patient's Current ABG & Acid-Base Values:</div>
                    <div class="drug-info-text">pH: ${ph} (Normal: 7.35-7.45) | PaCO2: ${paco2} mmHg (Normal: 35-45) | HCO3: ${hco3} mEq/L (Normal: 22-26)\nPaO2: ${pao2} mmHg (Normal: 80-100) | Lactate: ${lactate} mmol/L (Normal: < 2.0) | Na+: ${naVal} | K+: ${kVal} mEq/L</div>
                </div>
                <div class="drug-info-row">
                    <div class="drug-info-title">2. Complete Step-by-Step ABG Interpretation:</div>
                    <div class="drug-info-text" style="color:var(--drip-red);"><strong>Final Diagnosis: ${primaryDisorder}</strong>\n- Acid-Base State: ${phStatus}\n- Compensation Status: ${compensationStatus}\n- Oxygenation Status: ${o2Status}\n- Perfusion / Lactate: ${lacStatus}</div>
                </div>
                <div class="drug-info-row">
                    <div class="drug-info-title">3. Physiological Mechanism & Compensation:</div>
                    <div class="drug-info-text">${physiologicalMechanism}</div>
                </div>
                <div class="drug-info-row">
                    <div class="drug-info-title">4. How to Correct & Reach Ideal ABG State (Ventilator & Medical Plan):</div>
                    <div class="drug-info-text">${correctionPlan}\n- <strong>Oxygenation Plan:</strong> ${o2Correction}</div>
                </div>
                <div class="drug-info-row">
                    <div class="drug-info-title">5. Effect of Current pH on Potassium (K+) & Ionized Calcium (Ca++):</div>
                    <div class="drug-info-text">${kShiftEffect}</div>
                </div>
                <div class="drug-info-row">
                    <div class="drug-info-title">6. Arterial Blood Gas Nursing & Sampling Precautions:</div>
                    <div class="drug-info-text">- Perform Modified Allen's Test before radial artery puncture to verify collateral ulnar perfusion.\n- Expel all air bubbles immediately from heparinized ABG syringe (air bubbles falsely elevate PaO2 and lower PaCO2).\n- Analyze sample within 15 minutes (or place on ice to prevent ongoing WBC glycolysis from falsely lowering pH/PaO2 and raising Lactate).\n- Repeat ABG 30 to 60 minutes after any mechanical ventilator parameter change.</div>
                </div>
            `;
            document.getElementById("drugModalOverlay").style.display = "flex";
        }

        // 5. دالة تحديد الأشعة التشخيصية المطلوبة للحالة (فقط للتشخيصات التي تستدعي أشعة) وفتح البوب أب الخاصة بها
        function getPatientRadiologyInfo(p) {
            const diag = (p.ICU_Diagnosis || "").toLowerCase();

            if (diag.includes("pulmonary embolism")) {
                return {
                    hasImaging: true,
                    shortLabel: "CTPA (Chest CT Angiogram) + LL Venous Duplex + Echo",
                    modality: "CT Pulmonary Angiography (CTPA) with IV Contrast + Bilateral Lower Limb Venous Duplex Ultrasound + Transthoracic Echocardiogram (TTE).",
                    region: "Thorax / Pulmonary Arterial Tree, Bilateral Femoral-Popliteal Veins & Heart Chambers.",
                    findings: "- CTPA: Intraluminal saddle/lobar filling defect occluding main pulmonary arteries with Right-to-Left Ventricular (RV/LV) diameter ratio > 1.0.\n- LL Venous Duplex: Non-compressible deep femoral/popliteal vein with absent Doppler color flow (confirming DVT source).\n- Bedside Echo: RV dilation/hypokinesis (McConnell's sign), flattened interventricular septum (D-shape LV), and dilated non-collapsing IVC.",
                    nursingPrep: "- Check Serum Creatinine & eGFR prior to IV iodinated contrast; hold Metformin for 48h post-contrast and hydrate cautiously.\n- Ensure large-bore antecubital IV (18G) for power-injector contrast bolus.\n- Travel with portable O2/ventilator, emergency airway kit, and Norepinephrine pump during CT transport."
                };
            } else if (diag.includes("aortic dissection")) {
                return {
                    hasImaging: true,
                    shortLabel: "CTA Aorta (Chest/Abdomen) + Transesophageal Echo",
                    modality: "ECG-Gated CT Angiography (CTA) of Thoracic & Abdominal Aorta + Bedside Transesophageal Echocardiography (TEE).",
                    region: "Ascending Aorta, Aortic Arch, Descending Thoracic & Abdominal Aorta.",
                    findings: "- CTA Aorta: Intimal dissection flap separating True Lumen and False Lumen, periaortic hematoma, and assessment of coronary/carotid/renal branch involvement.\n- Portable Chest X-Ray: Widened mediastinum (> 8 cm) and left apical pleural cap.",
                    nursingPrep: "- CRITICAL TRANSPORT RULE: Keep Heart Rate < 60 bpm (Esmolol/Labetalol drip) and SBP 100-120 mmHg (Nicardipine drip) continuously during transport to CT suite.\n- Monitor radial arterial line waveform and check renal function post-contrast."
                };
            } else if (diag.includes("traumatic brain") || diag.includes("tbi") || diag.includes("intracranial hemorrhage") || diag.includes("ich") || diag.includes("subarachnoid") || diag.includes("sah") || diag.includes("craniotomy")) {
                return {
                    hasImaging: true,
                    shortLabel: "Non-Contrast Brain CT + Cerebral CTA + TCD Doppler",
                    modality: "Urgent Non-Contrast Cranial CT Scan + CT Cerebral Angiography (CTA) + Daily Bedside Transcranial Doppler (TCD).",
                    region: "Brain Parenchyma, Ventricular System, Basal Cisterns, Circle of Willis & Cervical Spine.",
                    findings: "- Brain CT: Hyperdense acute hematoma (Biconvex lens-shaped in Epidural, Crescent-shaped in Subdural, Basal Cistern star-shaped blood in SAH, or Basal Ganglia bleed in ICH), cerebral edema, effaced sulci, and Midline Shift (> 5 mm).\n- Transcranial Doppler (TCD): Elevated Mean Flow Velocity in Middle Cerebral Artery (> 120-200 cm/sec indicates cerebral vasospasm in SAH).",
                    nursingPrep: "- MANDATORY EVD SAFETY: Clamp the External Ventricular Drain (EVD) before laying the patient flat on the CT scanner table, and unclamp/re-level at the Tragus immediately upon return!\n- Maintain strict C-spine collar immobilization and monitor EtCO2 (35-38 mmHg) on portable transport ventilator."
                };
            } else if (diag.includes("ischemic stroke") || diag.includes("stroke") || diag.includes("cva")) {
                return {
                    hasImaging: true,
                    shortLabel: "Brain CT / CTA + Brain MRI (DWI) + Carotid Duplex",
                    modality: "Non-Contrast Head CT + CT Angiography/Perfusion + Diffusion-Weighted Brain MRI (DWI) + Bilateral Carotid & Vertebral Artery Duplex.",
                    region: "Cerebral Hemispheres (MCA/ACA/PCA Territories) & Extracranial Carotid Arteries.",
                    findings: "- Non-Contrast Head CT: Rules out acute hemorrhage prior to tPA; shows hyperdense MCA sign and early insular ribbon loss.\n- Brain MRI (DWI): Bright restricted diffusion in acute ischemic core.\n- Carotid Duplex: Internal carotid artery atherosclerotic plaque stenosis (> 70%) and peak systolic velocity.",
                    nursingPrep: "- Remove all metallic monitoring leads/objects prior to Brain MRI.\n- Monitor neurological status (NIHSS & pupils) and keep BP within target range (< 180/105 mmHg post-tPA) during imaging."
                };
            } else if (diag.includes("status epilepticus") || diag.includes("coma") || diag.includes("encephalopathy")) {
                return {
                    hasImaging: true,
                    shortLabel: "Non-Contrast Brain CT + Brain MRI (FLAIR)",
                    modality: "Urgent Non-Contrast Brain CT Scan + Brain MRI (T2/FLAIR) + Continuous Bedside EEG.",
                    region: "Cerebral Cortex, Thalami, Brainstem & Ventricles.",
                    findings: "- Brain CT & MRI: Rules out structural space-occupying lesions, acute hemorrhage, hydrocephalus, or cortical ribbon hyperintensity (anoxic/seizure changes).",
                    nursingPrep: "- Ensure airway security (ETT taped firmly) and keep IV Midazolam/Propofol bolus ready during CT/MRI transport in case of breakthrough seizures."
                };
            } else if (diag.includes("ards") || diag.includes("drowning") || diag.includes("aspiration")) {
                return {
                    hasImaging: true,
                    shortLabel: "Portable Chest X-Ray (CXR) + High-Res Chest CT",
                    modality: "Daily Portable Anteroposterior Chest X-Ray (CXR) + Thorax CT Scan.",
                    region: "Bilateral Lung Fields, Tracheobronchial Tree & Pleural Spaces.",
                    findings: "- Chest X-Ray & CT: Bilateral diffuse patchy and confluent alveolar ground-glass opacities ('White-Out Lungs') sparing costophrenic angles, dependent dorsal consolidation, normal cardiothoracic ratio, and verification of ETT tip 3-5 cm above carina.",
                    nursingPrep: "- Verify Endotracheal Tube depth at lip before and after placing X-ray cassette behind the patient's back.\n- Maintain PEEP during transport using a portable ICU ventilator (never bag-ventilate without a PEEP valve)."
                };
            } else if (diag.includes("pneumothorax") || diag.includes("pleural effusion") || diag.includes("pneumonia") || diag.includes("lung injury") || diag.includes("contusion") || diag.includes("copd") || diag.includes("asthma") || diag.includes("respiratory failure")) {
                return {
                    hasImaging: true,
                    shortLabel: "Portable Chest X-Ray (CXR) + Bedside Lung US",
                    modality: "Portable Chest X-Ray (AP View) + Bedside Thoracic Ultrasound (BLUE Protocol).",
                    region: "Lungs, Pleural Cavity, Diaphragm & Mediastinum.",
                    findings: "- Chest X-Ray / Lung US: Lobar consolidation with air bronchograms (Pneumonia), visceral pleural line with absent lung sliding/barcode sign (Pneumothorax), anechoic pleural fluid collection above diaphragm (Pleural Effusion), or hyperinflated lungs with flattened hemidiaphragms (COPD/Asthma).\n- Confirms Chest Tube and Central Venous Catheter tip placement.",
                    nursingPrep: "- Position patient upright / Semi-Fowler's for portable CXR to clearly visualize air-fluid levels and pneumothorax apices.\n- Never clamp a bubbling chest tube during radiology exams."
                };
            } else if (diag.includes("cardiogenic") || diag.includes("myocardial infarction") || diag.includes("stemi") || diag.includes("heart failure") || diag.includes("adhf") || diag.includes("cabg") || diag.includes("tamponade") || diag.includes("arrhythmia") || diag.includes("cardiac arrest") || diag.includes("rosc")) {
                return {
                    hasImaging: true,
                    shortLabel: "Bedside Echocardiogram (Echo) + Portable CXR",
                    modality: "2D Transthoracic Echocardiography (TTE) with Color Doppler + Portable Chest X-Ray (CXR) + Coronary Angiography.",
                    region: "Heart Chambers, Myocardium, Pericardial Sac, Great Vessels & Lung Fields.",
                    findings: "- Bedside Echo: Left Ventricular Ejection Fraction (LVEF %), anterior/inferior regional wall motion akinesis (STEMI), circumferential pericardial effusion with RV diastolic collapse (Tamponade), and IVC collapsibility index.\n- Portable CXR: Cardiomegaly, perihilar bat-wing alveolar edema, Kerley B lines, and verification of ETT, CVC, Swan-Ganz, or IABP tip position.",
                    nursingPrep: "- Keep defibrillator pads and ECG leads attached during bedside Echo and portable CXR.\n- Monitor arterial line blood pressure and chest tube patency during cassette placement."
                };
            } else if (diag.includes("pancreatitis") || diag.includes("perforation") || diag.includes("peritonitis") || diag.includes("mesenteric")) {
                return {
                    hasImaging: true,
                    shortLabel: "Contrast Abdominal/Pelvic CT + Erect CXR / Abd US",
                    modality: "Contrast-Enhanced CT Abdomen & Pelvis (CECT / Mesenteric CTA) + Erect Chest/Abdominal X-Ray + Hepatobiliary Ultrasound.",
                    region: "Pancreas, Peritoneal Cavity, Superior Mesenteric Artery (SMA), Bowel Loops & Biliary Tree.",
                    findings: "- Contrast CT Abdomen: Pancreatic parenchymal necrosis and peripancreatic fluid collections (Balthazar score in Pancreatitis); Superior Mesenteric Artery thromboembolism with bowel wall thickening and pneumatosis intestinalis (Mesenteric Ischemia).\n- Erect CXR / CT: Free intraperitoneal air under the diaphragm (Pneumoperitoneum in Bowel Perforation) and dilated air-fluid bowel loops (Ileus).",
                    nursingPrep: "- Ensure NGT decompression before supine CT scan to prevent aspiration of bilious gastric contents.\n- Check Serum Creatinine before IV contrast and maintain aggressive Ringer's Lactate hydration to prevent contrast nephropathy."
                };
            } else if (diag.includes("hepatic") || diag.includes("cirrhosis") || diag.includes("liver") || diag.includes("variceal") || diag.includes("gastrointestinal bleeding")) {
                return {
                    hasImaging: true,
                    shortLabel: "Abdominal US + Portal Vein Color Doppler",
                    modality: "Bedside Hepatobiliary Ultrasound + Portal & Hepatic Vein Color Doppler + Upper GI Endoscopy.",
                    region: "Liver Parenchyma, Portal Vein, Spleen & Peritoneal Ascitic Cavity.",
                    findings: "- Abdominal US & Portal Doppler: Coarse nodular cirrhotic liver, splenomegaly, moderate-to-tense free peritoneal ascites (marking safe paracentesis pocket), and hepatofugal/slow portal venous flow ( ruling out Portal Vein Thrombosis).",
                    nursingPrep: "- Check INR and Platelet count prior to ultrasound-guided diagnostic/therapeutic paracentesis.\n- Infuse 8g Human Albumin 20% for every liter of ascitic fluid removed (> 5L)."
                };
            } else if (diag.includes("polytrauma") || diag.includes("hemorrhagic") || diag.includes("hypovolemic")) {
                return {
                    hasImaging: true,
                    shortLabel: "eFAST Ultrasound + Pan-CT Trauma Scan + Pelvic X-Ray",
                    modality: "Bedside Extended Focused Assessment with Sonography for Trauma (eFAST) + Whole-Body Trauma Pan-CT (Head, C-Spine, Chest, Abdomen, Pelvis) + Portable Pelvic/Long-Bone X-Rays.",
                    region: "Pericardium, Pleura, Morrison's Pouch, Splenorenal Recess, Pelvis & Spine.",
                    findings: "- eFAST Scan: Free anechoic intraperitoneal blood in Morrison's pouch/pelvis (Hemoperitoneum) or hemopericardium/hemothorax.\n- Trauma Pan-CT: Solid organ laceration (spleen/liver/kidney), retroperitoneal hematoma, or unstable pelvic ring fracture.",
                    nursingPrep: "- TRAUMA RULE: Do NOT transport a hemodynamically unstable trauma patient ('The CT Scanner is the Donut of Death') until airway is secured, Pelvic Binder is applied, and Massive Transfusion Protocol is running!"
                };
            } else if (diag.includes("septic shock") || diag.includes("sepsis") || diag.includes("mods")) {
                return {
                    hasImaging: true,
                    shortLabel: "Portable Chest X-Ray + Abdomino-Pelvic & Renal US",
                    modality: "Portable Chest X-Ray (CXR) + Bedside Abdomino-Pelvic & Renal Ultrasound (Sepsis Source Control).",
                    region: "Thorax, Kidneys/Urinary Tract, Gallbladder & Peritoneal Cavity.",
                    findings: "- Identifies occult infectious source requiring urgent drainage: lobar pneumonia/empyema, obstructive hydronephrosis/pyonephrosis (Urosepsis), acalculous cholecystitis, or intra-abdominal abscess.\n- Verifies Central Venous Catheter tip at Cavoatrial Junction.",
                    nursingPrep: "- Coordinate bedside ultrasound or CT-guided percutaneous drainage of any identified abscess/obstruction within 6-12 hours."
                };
            } else if (diag.includes("kidney") || diag.includes("aki") || diag.includes("esrd")) {
                return {
                    hasImaging: true,
                    shortLabel: "Bedside Renal & Bladder Ultrasound + CXR",
                    modality: "Bedside Renal, Ureteral & Bladder Ultrasound + Portable Chest X-Ray (for fluid overload).",
                    region: "Bilateral Kidneys, Renal Pelvis, Ureters & Urinary Bladder.",
                    findings: "- Renal Ultrasound: Rules out post-renal obstructive uropathy (hydronephrosis); evaluates kidney size and cortical echogenicity (small echogenic kidneys in chronic ESRD vs normal/enlarged kidneys in acute ATN).\n- Portable CXR: Assesses pulmonary venous congestion and pleural effusions.",
                    nursingPrep: "- Verify Foley catheter patency (irrigate if blocked by clots/sediment) prior to renal ultrasound."
                };
            }

            // الحالات التي لا تستدعي أشعة روتينية (مثل اضطرابات الأملاح البسيطة أو DKA غير المصحوبة بعدوى أو التسمم الدوائي البسيط)
            return { hasImaging: false };
        }

        function getPatientECGInfo(p) {
            const diag = (p.ICU_Diagnosis || "").toLowerCase();
            const labs = p.Labs || {};
            const vitals = p.Vitals || {};
            const kVal = parseFloat(labs.K || 4.2);
            const hrVal = parseInt((vitals.HR || "90").replace(/[^0-9]/g, ""), 10) || 90;
            const idNum = parseInt((p.Patient_ID || "10001").replace(/[^0-9]/g, ""), 10) || 1;

            if (diag.includes("hyperkalemia") || (kVal >= 6.0 && (diag.includes("kidney") || diag.includes("aki") || diag.includes("esrd") || diag.includes("acidosis")))) {
                return ECG_DATABASE["hyperkalemia_ecg"];
            }
            if (diag.includes("tamponade")) {
                return ECG_DATABASE["electrical_alternans"];
            }
            if (diag.includes("stemi") || diag.includes("myocardial infarction") || diag.includes("cardiogenic shock")) {
                return ECG_DATABASE["stemi_ecg"];
            }
            if (diag.includes("cardiac arrest") || diag.includes("rosc") || diag.includes("post-resuscitation")) {
                return (idNum % 2 === 0) ? ECG_DATABASE["ventricular_fibrillation"] : ECG_DATABASE["ventricular_tachycardia"];
            }
            if (diag.includes("arrhythmia") || diag.includes("vt") || diag.includes("vf") || diag.includes("afib")) {
                if (diag.includes("afib")) return ECG_DATABASE["atrial_fibrillation"];
                return (idNum % 3 === 0) ? ECG_DATABASE["atrial_fibrillation"] : ((idNum % 3 === 1) ? ECG_DATABASE["ventricular_tachycardia"] : ECG_DATABASE["ventricular_fibrillation"]);
            }
            if (diag.includes("mesenteric ischemia") || diag.includes("ischemic stroke")) {
                return ECG_DATABASE["atrial_fibrillation"];
            }
            if (diag.includes("copd") || diag.includes("pulmonary embolism")) {
                return (idNum % 2 === 0) ? ECG_DATABASE["atrial_flutter"] : ECG_DATABASE["sinus_tachycardia"];
            }
            if (diag.includes("heart failure") || diag.includes("adhf")) {
                return (idNum % 2 === 0) ? ECG_DATABASE["atrial_fibrillation"] : ECG_DATABASE["sinus_tachycardia"];
            }
            if (diag.includes("overdose") || diag.includes("toxicity")) {
                return ECG_DATABASE["tca_wide_qrs"];
            }
            if (diag.includes("traumatic brain") || diag.includes("tbi") || diag.includes("intracranial") || diag.includes("ich") || diag.includes("subarachnoid") || diag.includes("sah") || diag.includes("icp") || diag.includes("hypothermia") || hrVal < 65) {
                return ECG_DATABASE["sinus_bradycardia"];
            }
            if (diag.includes("aortic dissection") && hrVal <= 75) {
                return ECG_DATABASE["normal_sinus"];
            }
            if (diag.includes("cabg") || diag.includes("open heart") || (hrVal >= 60 && hrVal <= 100 && !diag.includes("shock") && !diag.includes("sepsis"))) {
                return ECG_DATABASE["normal_sinus"];
            }
            return ECG_DATABASE["sinus_tachycardia"];
        }

        function openECGModal(patientId) {
            const p = filteredPatients.find(item => item.Patient_ID === patientId) ||
                      allPatients.find(item => item.Patient_ID === patientId);
            if (!p) return;

            const ecg = getPatientECGInfo(p);
            const vitals = p.Vitals || {};
            const labs = p.Labs || {};

            document.getElementById("modalDrugHeader").textContent = `ECG Rhythm Analysis & Guide (${p.Patient_ID})`;
            document.getElementById("modalDrugBody").innerHTML = `

        function formatMedicationTextWithLinks(text) {
            if (!text) return "";
            let result = text;
            const placeholders = [];

            DRUG_KEYWORDS.forEach((item) => {
                const idx = result.indexOf(item.pattern);
                if (idx !== -1) {
                    const token = `__DRUG_LINK_${placeholders.length}__`;
                    const safeLabel = item.pattern.replace(/'/g, "\\'");
                    placeholders.push(
                        `<span class="clickable-drug" onclick="openDrugModal('${item.key}', '${safeLabel}')">${item.pattern}</span>`
                    );
                    result = result.split(item.pattern).join(token);
                }
            });

            placeholders.forEach((htmlLink, i) => {
                result = result.split(`__DRUG_LINK_${i}__`).join(htmlLink);
            });

            return result;
        }

        // دالة توليد الإجراءات التمريضية الخاصة (Enema, Gastric Lavage, Bladder IAP, EVD, Chest Tube...) حسب التشخيص
        function getSpecialNursingProcedures(p) {
            const baseInterventions = p.Nursing_Interventions || p.Priority_Nursing_Interventions || "";
            const diag = (p.ICU_Diagnosis || "").toLowerCase();
            let extraProc = "";

            if (diag.includes("hepatic") || diag.includes("cirrhosis") || diag.includes("liver") || diag.includes("variceal") || diag.includes("gastrointestinal bleeding")) {
                extraProc = "6. SPECIAL PROCEDURE (ENEMA & GI BLEED PROTOCOL): Administer Lactulose Retention Enema (300 mL Lactulose + 700 mL Warm Water/Normal Saline via rectal balloon tube, retained for 30-60 min in left lateral position) q6-8h to rapidly clear gut blood & Ammonia; perform Room-Temperature Saline Gastric Lavage via NGT prior to endoscopy and keep Sengstaken-Blakemore balloon tube at bedside.";
            } else if (diag.includes("overdose") || diag.includes("toxicity")) {
                extraProc = "6. SPECIAL PROCEDURE (GASTRIC DECONTAMINATION & BOWEL IRRIGATION): Perform Orogastric Lavage via large-bore 36-40Fr tube (after securing cuffed ETT airway) if within 1h of ingestion, followed by Single/Multiple-Dose Activated Charcoal (50g via OGT) and Polyethylene Glycol Whole-Bowel Irrigation / Cleansing Enema to accelerate toxin elimination.";
            } else if (diag.includes("pancreatitis") || diag.includes("peritonitis") || diag.includes("perforation") || diag.includes("mesenteric")) {
                extraProc = "6. SPECIAL PROCEDURE (DECOMPRESSION & IAP TRANSDUCER): Maintain Salem Sump NGT on Low Intermittent Wall Suction (-40 to -60 mmHg; irrigate air vent with 20mL air q4h), perform Trans-Vesical Intra-Abdominal Pressure (IAP) measurement via Foley catheter (instill 25mL sterile saline, zero at mid-axillary iliac crest) q4h, and strictly avoid rectal enemas if bowel perforation/ischemia is present.";
            } else if (diag.includes("traumatic brain") || diag.includes("tbi") || diag.includes("intracranial") || diag.includes("subarachnoid") || diag.includes("stroke") || diag.includes("icp") || diag.includes("craniotomy")) {
                extraProc = "6. SPECIAL PROCEDURE (NEURO BOWEL & EVD PROTOCOL): Administer scheduled Glycerin / Bisacodyl rectal suppositories + OGT Docusate/Lactulose to prevent constipation and Valsalva straining (avoid high-volume forceful enemas which spike ICP!); zero EVD transducer at tragus and clamp drain during all position changes.";
            } else if (diag.includes("hyperkalemia") || diag.includes("electrolyte") || diag.includes("kidney") || diag.includes("aki") || diag.includes("esrd")) {
                extraProc = "6. SPECIAL PROCEDURE (POTASSIUM CLEARANCE ENEMA & CRRT CARE): If oral/NGT route is contraindicated (ileus/vomiting) in severe Hyperkalemia, administer Sodium Polystyrene Sulfonate (Kayexalate 30-50g in 150mL warm water) Retention Enema for 30-60 min followed by non-sodium cleansing enema irrigation; maintain strict aseptic Heparin/Citrate lock care for Hemodialysis/CRRT catheter.";
            } else if (diag.includes("cabg") || diag.includes("open heart") || diag.includes("tamponade") || diag.includes("pneumothorax") || diag.includes("pleural")) {
                extraProc = "6. SPECIAL PROCEDURE (CHEST TUBE & EPICARDIAL PACER CARE): Perform gentle squeezing/milking of mediastinal drains if visible clots threaten tamponade (never vigorous stripping or clamping!), verify underwater seal suction (-20 cmH2O), and insulate temporary epicardial pacing wires with rubber glove finger.";
            } else if (diag.includes("burns") || diag.includes("polytrauma")) {
                extraProc = "6. SPECIAL PROCEDURE (BURN ESCHAROTOMY & COMPARTMENT CARE): Perform aseptic closed Silver Sulfadiazine / Paraffin gauze burn dressing changes under Ketamine analgesia, prepare bedside Escharotomy/Fasciotomy tray for circumferential burns, and perform hourly Bladder Pressure & Myoglobinuria urine checks.";
            } else if (diag.includes("ards") || diag.includes("pneumonia") || diag.includes("copd") || diag.includes("asthma") || diag.includes("drowning")) {
                extraProc = "6. SPECIAL PROCEDURE (AIRWAY CLEARANCE & BRONCHOSCOPY PREP): Perform percussive chest physiotherapy / high-frequency chest wall oscillation q4h, instill inline mucolytic nebulization, and prepare bedside Fiberoptic Bronchoscopy with warm saline bronchoalveolar lavage (BAL) for refractory mucus plugging/atelectasis.";
            } else {
                extraProc = "6. SPECIAL PROCEDURE (ICU BOWEL, FOLEY & LINE BUNDLE): Administer PRN Glycerin suppository / Fleet Enema if no bowel movement for > 72h in sedated ICU patient, perform daily Chlorhexidine 2% bed bath, and audit CVC/Foley line necessity daily.";
            }

            if (baseInterventions.includes("SPECIAL PROCEDURE")) {
                return baseInterventions;
            }
            return baseInterventions ? (baseInterventions + "\n" + extraProc) : extraProc;
        }

        async function loadDataset() {
            const cacheBuster = "?v=" + new Date().getTime();

            try {
                const jsonRes = await fetch("./icu_patients_10000.json" + cacheBuster);
                if (jsonRes.ok) {
                    return await jsonRes.json();
                }
            } catch (e) {}

            try {
                const gzRes = await fetch("./icu_patients_10000.json.gz" + cacheBuster);
                if (gzRes.ok) {
                    const buffer = await gzRes.arrayBuffer();
                    const bytes = new Uint8Array(buffer);
                    if (bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b) {
                        const ds = new DecompressionStream("gzip");
                        const decompressedStream = new Blob([buffer]).stream().pipeThrough(ds);
                        const text = await new Response(decompressedStream).text();
                        return JSON.parse(text);
                    } else {
                        const text = new TextDecoder("utf-8").decode(bytes);
                        return JSON.parse(text);
                    }
                }
            } catch (e) {}

            try {
                const oldRes = await fetch("./ICU_Complete_Nursing_Dataset_10000.json" + cacheBuster);
                if (oldRes.ok) return await oldRes.json();
            } catch (e) {}

            try {
                const apiRes = await fetch("/api/patients");
                if (apiRes.ok) return await apiRes.json();
            } catch (e) {}

            throw new Error("Dataset file not found.");
        }
